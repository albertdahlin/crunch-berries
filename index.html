<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Tower Defence</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #0a0a1a;
  display: flex;
  flex-direction: column;
  align-items: center;
  min-height: 100vh;
  min-height: 100dvh;
  touch-action: pan-y;
  font-family: monospace;
  color: #ccc;
}
canvas {
  display: block;
  width: 100vw;
}
#hud {
  position: sticky;
  top: 0;
  display: none;
  width: 100%;
  background: rgba(10, 10, 26, 0.9);
  z-index: 10;
  font-family: monospace;
  font-size: 14px;
  padding: 6px 8px;
  gap: 12px;
  justify-content: space-between;
}
#hud span { white-space: nowrap; }
.hud-gold { color: #ffd700; }
.hud-lives { color: #ef5350; }
.hud-wave { color: #81d4fa; }
.hud-score { color: #aaa; }
.hud-version { color: #555; }
.hud-phase { font-weight: bold; }
#ui {
  position: sticky;
  bottom: 0;
  display: flex;
  gap: 6px;
  padding: 10px 8px;
  padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px));
  flex-wrap: wrap;
  justify-content: center;
  background: #0a0a1a;
  width: 100%;
  z-index: 10;
}
#ui button, #settings button {
  padding: 6px 12px;
  font-size: 14px;
  font-family: monospace;
  background: #222;
  color: #ccc;
  border: 1px solid #444;
  border-radius: 4px;
  cursor: pointer;
  touch-action: manipulation;
}
#ui button:active { background: #444; }
#ui button.selected { border-color: #fff; background: #333; }
#btn-place { background: #1b5e20; border-color: #4caf50; color: #fff; }
#btn-place:active { background: #2e7d32; }
#btn-wave { background: #0d47a1; border-color: #42a5f5; color: #fff; }
#btn-wave:active { background: #1565c0; }
#tower-buttons { display: contents; }
#brush-buttons { display: contents; }

/* Settings overlay */
#settings {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 100;
  background: #0a0a1a;
  flex-direction: column;
  overflow-y: auto;
  padding: 16px;
  padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px));
}
#settings h2 { color: #81d4fa; margin: 16px 0 8px; font-size: 16px; }
#settings h2:first-child { margin-top: 0; }
#settings .cfg-item {
  background: #111;
  border: 1px solid #333;
  border-radius: 6px;
  padding: 10px;
  margin-bottom: 8px;
}
#settings .cfg-item-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 6px;
  font-weight: bold;
  color: #aaa;
}
#settings .cfg-row {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-bottom: 4px;
  align-items: center;
}
#settings fieldset {
  border: 1px solid #2a2a3a;
  border-radius: 4px;
  padding: 6px 8px;
  margin-bottom: 6px;
}
#settings fieldset legend {
  color: #666;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  padding: 0 4px;
}
#settings label {
  display: flex;
  align-items: center;
  gap: 4px;
  font-size: 13px;
  color: #999;
}
#settings input[type="text"],
#settings input[type="number"],
#settings select {
  width: 60px;
  padding: 4px;
  background: #1a1a2a;
  color: #fff;
  border: 1px solid #444;
  border-radius: 3px;
  font-family: monospace;
  font-size: 13px;
}
#settings input[type="text"] { width: 80px; }
#settings select { width: 90px; }
#settings input[type="color"] {
  width: 32px;
  height: 24px;
  padding: 0;
  border: 1px solid #444;
  border-radius: 3px;
  background: none;
  cursor: pointer;
}
#settings .cfg-remove {
  background: #4a1a1a;
  border-color: #f44336;
  color: #f44336;
  padding: 2px 8px;
  font-size: 12px;
}
#settings .cfg-add {
  background: #1a2a1a;
  border-color: #4caf50;
  color: #4caf50;
  margin: 4px 0 12px;
}
#settings .cfg-actions {
  display: flex;
  gap: 8px;
  margin-top: 16px;
  padding-top: 12px;
  border-top: 1px solid #333;
}
#settings .cfg-actions button { flex: 1; padding: 10px; font-size: 15px; }
.btn-save { background: #1b5e20 !important; border-color: #4caf50 !important; color: #fff !important; }
.btn-reset { background: #4a1a1a !important; border-color: #f44336 !important; color: #f44336 !important; }

/* Settings list items */
#settings .cfg-list-item {
  display: flex;
  align-items: center;
  gap: 10px;
  background: #111;
  border: 1px solid #333;
  border-radius: 6px;
  padding: 10px 12px;
  margin-bottom: 6px;
  cursor: pointer;
  font-family: monospace;
  font-size: 14px;
  color: #ccc;
}
#settings .cfg-list-item:active { background: #222; }
#settings .cfg-list-item .cfg-swatch {
  width: 24px;
  height: 24px;
  border-radius: 3px;
  border: 1px solid #555;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: bold;
  font-size: 14px;
}
#settings .cfg-list-item .cfg-list-name { flex: 1; }
#settings .cfg-list-item .cfg-list-arrow { color: #555; }

/* Settings detail view */
#settings-detail {
  display: none;
  flex-direction: column;
}
#settings-detail .cfg-detail-header {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 12px;
}
#settings-detail .cfg-detail-header button {
  padding: 6px 12px;
  font-size: 14px;
  font-family: monospace;
  background: #222;
  color: #ccc;
  border: 1px solid #444;
  border-radius: 4px;
  cursor: pointer;
}
#settings-detail .cfg-detail-header span {
  color: #81d4fa;
  font-size: 16px;
  font-weight: bold;
}
#settings-detail .cfg-detail-body .cfg-item {
  border: none;
  padding: 0;
  background: none;
}

/* Editor UI */
#editor-ui {
  position: sticky;
  bottom: 0;
  display: none;
  flex-direction: column;
  gap: 6px;
  padding: 10px 8px;
  padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px));
  background: #0a0a1a;
  width: 100%;
  z-index: 10;
}
#editor-ui .editor-row {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  justify-content: center;
}
#editor-ui button {
  padding: 6px 12px;
  font-size: 14px;
  font-family: monospace;
  background: #222;
  color: #ccc;
  border: 1px solid #444;
  border-radius: 4px;
  cursor: pointer;
  touch-action: manipulation;
}
#editor-ui button:active { background: #444; }
#editor-ui button.selected { border-color: #fff; background: #333; }
#btn-editor-play { background: #1b5e20; border-color: #4caf50; color: #fff; }
#btn-editor-save { background: #0d47a1; border-color: #42a5f5; color: #fff; }
#btn-editor-back { background: #333; border-color: #666; }
#btn-editor-clear { background: #4a1a1a; border-color: #f44336; color: #f44336; }

/* Map select screen */
#map-select {
  display: none;
  flex-direction: column;
  align-items: center;
  min-height: 100vh;
  min-height: 100dvh;
  padding: 24px 16px;
  padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px));
  overflow-y: auto;
}
#map-select h1 {
  color: #81d4fa;
  font-family: monospace;
  font-size: 24px;
  margin-bottom: 24px;
}
#map-select .ms-list {
  width: 100%;
  max-width: 400px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
#map-select .ms-item {
  background: #111;
  border: 1px solid #333;
  border-radius: 6px;
  padding: 12px 14px;
  cursor: pointer;
  font-family: monospace;
  touch-action: manipulation;
}
#map-select .ms-item:active { background: #1a1a2a; }
#map-select .ms-item-title {
  font-size: 15px;
  font-weight: bold;
  color: #4caf50;
}
#map-select .ms-item-desc {
  font-size: 12px;
  color: #555;
  margin-top: 4px;
}
#map-select .ms-saved {
  border-color: #4fc3f7;
}
#map-select .ms-saved .ms-item-title {
  color: #fff;
}
#map-select .ms-saved-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
}
#map-select .ms-btn-edit {
  padding: 4px 8px;
  font-size: 16px;
  line-height: 1;
  font-family: monospace;
  border-radius: 4px;
  cursor: pointer;
  touch-action: manipulation;
  background: none;
  border: 1px solid #4caf50;
  color: #4caf50;
}
#map-select .ms-settings {
  border-color: #555;
  text-align: center;
}
#map-select .ms-settings .ms-item-title {
  color: #888;
}
#map-select .ms-version {
  color: #333;
  font-family: monospace;
  font-size: 12px;
  margin-top: 12px;
}
</style>
</head>
<body>
<div id="hud">
  <span class="hud-gold" id="hud-gold">G:0</span>
  <span class="hud-lives" id="hud-lives">L:0</span>
  <span class="hud-wave" id="hud-wave">W:0</span>
  <span class="hud-score" id="hud-score">S:0</span>
  <span class="hud-version" id="hud-version"></span>
  <span class="hud-phase" id="hud-phase"></span>
</div>
<div id="map-select">
  <h1>TOWER DEFENCE</h1>
  <div class="ms-list" id="ms-list"></div>
  <div class="ms-version" id="ms-version"></div>
</div>
<canvas id="game"></canvas>
<div id="ui">
  <span id="tower-buttons"></span>
  <button id="btn-place">Place</button>
  <button id="btn-upgrade" style="display:none;background:#1b5e20;border-color:#4caf50;color:#fff">Upgrade</button>
  <button id="btn-sell" style="display:none;background:#b71c1c;border-color:#f44336;color:#fff">Sell</button>
  <button id="btn-wave">Wave (W)</button>
  <button id="btn-settings">Cfg</button>
</div>

<div id="editor-ui">
  <div class="editor-row">
    <label style="color:#999;font-size:13px;font-family:monospace;display:flex;align-items:center;gap:4px">Name <input type="text" id="editor-map-name" maxlength="24" style="width:100px;padding:4px 6px;background:#1a1a2a;color:#fff;border:1px solid #444;border-radius:3px;font-family:monospace;font-size:13px"></label>
    <label style="color:#999;font-size:13px;font-family:monospace;display:flex;align-items:center;gap:4px">W<input type="number" id="editor-map-cols" min="5" max="60" style="width:44px;padding:4px;background:#1a1a2a;color:#fff;border:1px solid #444;border-radius:3px;font-family:monospace;font-size:13px"></label>
    <label style="color:#999;font-size:13px;font-family:monospace;display:flex;align-items:center;gap:4px">H<input type="number" id="editor-map-rows" min="5" max="60" style="width:44px;padding:4px;background:#1a1a2a;color:#fff;border:1px solid #444;border-radius:3px;font-family:monospace;font-size:13px"></label>
  </div>
  <div class="editor-row">
    <span id="brush-buttons"></span>
    <button id="btn-editor-size">1x1</button>
  </div>
  <div class="editor-row">
    <span id="brush-help" style="color:#888;font-size:11px;font-family:monospace"></span>
  </div>
  <div class="editor-row">
    <button id="btn-editor-play">Play</button>
    <button id="btn-editor-save">Save</button>
    <button id="btn-editor-clear">Clear</button>
    <button id="btn-editor-delete" style="display:none;background:#4a1a1a;border-color:#f44336;color:#f44336">Delete</button>
    <button id="btn-editor-back">Back</button>
  </div>
</div>

<div id="settings">
  <div id="settings-list">
    <h2>Towers</h2>
    <div id="settings-towers"></div>
    <button class="cfg-add" onclick="addTowerType()">+ Add Tower</button>

    <h2>Monsters</h2>
    <div id="settings-monsters"></div>
    <button class="cfg-add" onclick="addMonsterType()">+ Add Monster</button>

    <h2>Waves</h2>
    <div id="settings-wave-monsters"></div>
    <div class="cfg-item">
      <div class="cfg-row">
        <label>Double every <input type="number" id="cfg-scaleEvery" min="1" value="2"> waves</label>
        <label>HP +<input type="number" id="cfg-hpScale" min="0" value="20">% / wave</label>
      </div>
      <div class="cfg-row">
        <label>Interval start <input type="number" id="cfg-intervalStart" min="1"></label>
        <label>Decay <input type="number" id="cfg-intervalDecay" min="0"></label>
        <label>Min <input type="number" id="cfg-intervalMin" min="1"></label>
      </div>
    </div>

    <h2>Game</h2>
    <div class="cfg-item">
      <div class="cfg-row">
        <label>Start Gold <input type="number" id="cfg-startGold" min="0"></label>
        <label>Start Lives <input type="number" id="cfg-startLives" min="1"></label>
        <label>Wave Bonus <input type="number" id="cfg-waveBonusGold" min="0"></label>
        <label>Sell Refund <input type="number" id="cfg-sellRefundPercent" min="0" max="100">%</label>
      </div>
    </div>

    <div class="cfg-actions">
      <button class="btn-save" onclick="closeSettings()">Save & Close</button>
      <button class="btn-reset" onclick="resetSettings()">Reset Defaults</button>
    </div>
    <div class="cfg-actions">
      <button onclick="exportData()" style="background:#0d47a1;border-color:#42a5f5;color:#fff">Export</button>
      <button onclick="importData()" style="background:#0d47a1;border-color:#42a5f5;color:#fff">Import</button>
    </div>
  </div>

  <div id="settings-detail">
    <div class="cfg-detail-header">
      <button onclick="closeDetail()">Back</button>
      <span id="settings-detail-title"></span>
      <button class="cfg-remove" onclick="deleteDetailItem()" style="margin-left:auto">Delete</button>
    </div>
    <div class="cfg-detail-body" id="settings-detail-body"></div>
  </div>
</div>

<script src="game.js"></script>
</body>
</html>
