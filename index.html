<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Tower Defence</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #0a0a1a;
  display: flex;
  flex-direction: column;
  align-items: center;
  min-height: 100vh;
  min-height: 100dvh;
  touch-action: pan-y;
  font-family: monospace;
  color: #ccc;
}
canvas {
  display: block;
  width: 100vw;
}
#hud {
  position: sticky;
  top: 0;
  display: none;
  width: 100%;
  background: rgba(10, 10, 26, 0.9);
  z-index: 10;
  font-family: monospace;
  font-size: 14px;
  padding: 6px 8px;
  gap: 12px;
  justify-content: space-between;
}
#hud span { white-space: nowrap; }
.hud-gold { color: #ffd700; }
.hud-lives { color: #ef5350; }
.hud-wave { color: #81d4fa; }
.hud-score { color: #aaa; }
.hud-version { color: #555; }
.hud-phase { font-weight: bold; }
#ui {
  position: sticky;
  bottom: 0;
  display: none;
  gap: 6px;
  padding: 10px 8px;
  padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px));
  flex-wrap: wrap;
  justify-content: center;
  background: #0a0a1a;
  width: 100%;
  z-index: 10;
}
#ui button, #edit-campaign button {
  padding: 6px 12px;
  font-size: 14px;
  font-family: monospace;
  background: #222;
  color: #ccc;
  border: 1px solid #444;
  border-radius: 4px;
  cursor: pointer;
  touch-action: manipulation;
}
#ui button:active { background: #444; }
#ui button.selected { border-color: #fff; background: #333; }
#btn-place { background: #1b5e20; border-color: #4caf50; color: #fff; }
#btn-place:active { background: #2e7d32; }
#btn-wave { background: #0d47a1; border-color: #42a5f5; color: #fff; }
#btn-wave:active { background: #1565c0; }
#btn-save { background: #333; border-color: #888; color: #ccc; }
#btn-home { background: #333; border-color: #666; }
#tower-buttons { display: contents; }
#brush-buttons { display: contents; }

/* Campaign editor (formerly settings) overlay */
#edit-campaign {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 100;
  background: #0a0a1a;
  flex-direction: column;
  overflow-y: auto;
  padding: 16px;
  padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px));
}
#edit-campaign h2 { color: #81d4fa; margin: 16px 0 8px; font-size: 16px; }
#edit-campaign h2:first-of-type { margin-top: 0; }
#edit-campaign .cfg-item {
  background: #111;
  border: 1px solid #333;
  border-radius: 6px;
  padding: 10px;
  margin-bottom: 8px;
}
#edit-campaign .cfg-item-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 6px;
  font-weight: bold;
  color: #aaa;
}
#edit-campaign .cfg-row {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-bottom: 4px;
  align-items: center;
}
#edit-campaign fieldset {
  border: 1px solid #2a2a3a;
  border-radius: 4px;
  padding: 6px 8px;
  margin-bottom: 6px;
}
.tree-nav { margin-bottom: 8px; font-family: monospace; font-size: 13px; color: #888; }
.tree-crumb { color: #4caf50; cursor: pointer; }
.tree-crumb:hover { text-decoration: underline; }
.tree-crumb.current { color: #fff; cursor: default; }
.tree-crumb.current:hover { text-decoration: none; }
.tree-children { display: flex; gap: 4px; flex-wrap: wrap; align-items: center; }
.tree-upgrade-list { display: flex; flex-direction: column; gap: 4px; }
.tree-upgrade-list .cfg-list-item { cursor: pointer; padding: 6px 8px; }
.tree-child-rm { background: none; border: 1px solid #f44336; color: #f44336; padding: 2px 6px; min-width: 0; margin-left: auto; flex-shrink: 0; }
.tree-child-add { background: none; border: 1px solid #4caf50; color: #4caf50; align-self: flex-start; }
.cfg-help {
  display: inline-flex; align-items: center; justify-content: center;
  width: 14px; height: 14px; border-radius: 50%;
  background: #333; color: #666; font-size: 10px;
  cursor: pointer; flex-shrink: 0; font-family: monospace;
}
.cfg-help:hover { color: #aaa; background: #444; }
.help-overlay {
  position: fixed; inset: 0; z-index: 200;
  background: rgba(0,0,0,0.7);
  display: flex; align-items: center; justify-content: center; padding: 24px;
}
.help-overlay-text {
  background: #1a1a2a; border: 1px solid #444; border-radius: 8px;
  padding: 16px 20px; color: #ccc; font-family: monospace;
  font-size: 14px; max-width: 300px; text-align: center; line-height: 1.5;
}
.bestiary-overlay {
  position: fixed; inset: 0; z-index: 150;
  background: rgba(0,0,0,0.75);
  display: flex; align-items: center; justify-content: center; padding: 16px;
}
.bestiary-box {
  background: #111; border: 1px solid #444; border-radius: 8px;
  padding: 12px; max-width: 380px; width: 100%; max-height: 80vh;
  overflow-y: auto; font-family: monospace;
}
.bestiary-title {
  color: #ef5350; font-size: 16px; font-weight: bold;
  text-align: center; margin-bottom: 10px;
}
.bestiary-row {
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
  padding: 8px; border: 1px solid #2a2a3a; border-radius: 4px;
  margin-bottom: 4px; cursor: pointer;
}
.bestiary-row:hover { background: #1a1a2a; }
.bestiary-icon {
  width: 22px; height: 22px; border-radius: 3px;
  display: flex; align-items: center; justify-content: center;
  font-weight: bold; font-size: 13px; flex-shrink: 0;
}
.bestiary-info { display: flex; flex-direction: column; flex: 1; min-width: 0; }
.bestiary-name { color: #ccc; font-size: 13px; font-weight: bold; }
.bestiary-desc { color: #777; font-size: 11px; margin-top: 2px; }
.bestiary-stats {
  display: none; width: 100%; color: #aaa; font-size: 11px;
  padding: 6px 0 0; white-space: pre-line; line-height: 1.6;
}
.bestiary-close {
  text-align: center; color: #666; font-size: 12px;
  margin-top: 8px; cursor: pointer; padding: 4px;
}
.bestiary-close:hover { color: #aaa; }
#edit-campaign fieldset legend {
  color: #666;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  padding: 0 4px;
}
#edit-campaign label {
  display: flex;
  align-items: center;
  gap: 4px;
  font-size: 13px;
  color: #999;
}
#edit-campaign input[type="text"],
#edit-campaign input[type="number"],
#edit-campaign select {
  width: 60px;
  padding: 4px;
  background: #1a1a2a;
  color: #fff;
  border: 1px solid #444;
  border-radius: 3px;
  font-family: monospace;
  font-size: 13px;
}
#edit-campaign input[type="text"] { width: 80px; }
#edit-campaign select { width: 90px; }
#edit-campaign input[type="color"] {
  width: 32px;
  height: 24px;
  padding: 0;
  border: 1px solid #444;
  border-radius: 3px;
  background: none;
  cursor: pointer;
}
#edit-campaign .cfg-remove {
  background: #4a1a1a;
  border-color: #f44336;
  color: #f44336;
  padding: 2px 8px;
  font-size: 12px;
}
#edit-campaign .cfg-add {
  background: #1a2a1a;
  border-color: #4caf50;
  color: #4caf50;
  margin: 4px 0 12px;
}
#edit-campaign .cfg-actions {
  display: flex;
  gap: 8px;
  margin-top: 16px;
  padding-top: 12px;
  border-top: 1px solid #333;
}
#edit-campaign .cfg-actions button { flex: 1; padding: 10px; font-size: 15px; }
.btn-save { background: #1b5e20 !important; border-color: #4caf50 !important; color: #fff !important; }
.btn-reset { background: #4a1a1a !important; border-color: #f44336 !important; color: #f44336 !important; }

#edit-campaign .cfg-list-item {
  display: flex;
  align-items: center;
  gap: 10px;
  background: #111;
  border: 1px solid #333;
  border-radius: 6px;
  padding: 10px 12px;
  margin-bottom: 6px;
  cursor: pointer;
  font-family: monospace;
  font-size: 14px;
  color: #ccc;
}
#edit-campaign .cfg-list-item:active { background: #222; }
#edit-campaign .cfg-list-item .cfg-swatch {
  width: 24px;
  height: 24px;
  border-radius: 3px;
  border: 1px solid #555;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: bold;
  font-size: 14px;
}
#edit-campaign .cfg-list-item .cfg-list-name { flex: 1; }
#edit-campaign .cfg-list-item .cfg-list-arrow { color: #555; }

#settings-detail {
  display: none;
  flex-direction: column;
}
#settings-detail .cfg-detail-header {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 12px;
}
#settings-detail .cfg-detail-header button {
  padding: 6px 12px;
  font-size: 14px;
  font-family: monospace;
  background: #222;
  color: #ccc;
  border: 1px solid #444;
  border-radius: 4px;
  cursor: pointer;
}
#settings-detail .cfg-detail-header span {
  color: #81d4fa;
  font-size: 16px;
  font-weight: bold;
}
#settings-detail .cfg-detail-body .cfg-item {
  border: none;
  padding: 0;
  background: none;
}

/* Editor UI */
#editor-ui {
  position: sticky;
  bottom: 0;
  display: none;
  flex-direction: column;
  gap: 6px;
  padding: 10px 8px;
  padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px));
  background: #0a0a1a;
  width: 100%;
  z-index: 10;
}
#editor-ui .editor-row {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  justify-content: center;
}
#editor-ui button {
  padding: 6px 12px;
  font-size: 14px;
  font-family: monospace;
  background: #222;
  color: #ccc;
  border: 1px solid #444;
  border-radius: 4px;
  cursor: pointer;
  touch-action: manipulation;
}
#editor-ui button:active { background: #444; }
#editor-ui button.selected { border-color: #fff; background: #333; }
#btn-editor-play { background: #1b5e20; border-color: #4caf50; color: #fff; }
#btn-editor-save { background: #0d47a1; border-color: #42a5f5; color: #fff; }
#btn-editor-back { background: #333; border-color: #666; }
#btn-editor-clear { background: #4a1a1a; border-color: #f44336; color: #f44336; }

/* Screens (home, pickers, empty settings) */
#home, #screen-list, #screen-settings {
  display: none;
  flex-direction: column;
  align-items: center;
  min-height: 100vh;
  min-height: 100dvh;
  padding: 24px 16px;
  padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px));
  overflow-y: auto;
  width: 100%;
}
#home h1 {
  color: #81d4fa;
  font-family: monospace;
  font-size: 24px;
  margin-bottom: 24px;
}
.screen-header {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  max-width: 400px;
  margin-bottom: 16px;
}
.screen-header button {
  padding: 6px 12px;
  font-family: monospace;
  font-size: 14px;
  background: #222;
  color: #ccc;
  border: 1px solid #444;
  border-radius: 4px;
  cursor: pointer;
}
.screen-title {
  color: #81d4fa;
  font-family: monospace;
  font-size: 18px;
  font-weight: bold;
}
.ms-list {
  width: 100%;
  max-width: 400px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.ms-item {
  background: #111;
  border: 1px solid #333;
  border-radius: 6px;
  padding: 12px 14px;
  cursor: pointer;
  font-family: monospace;
  touch-action: manipulation;
}
.ms-item:active { background: #1a1a2a; }
.ms-item-title {
  font-size: 15px;
  font-weight: bold;
  color: #4caf50;
}
.ms-item-desc {
  font-size: 12px;
  color: #555;
  margin-top: 4px;
}
.ms-saved { border-color: #4fc3f7; }
.ms-saved .ms-item-title { color: #fff; }
.ms-saved-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.ms-btn-edit, .ms-btn-del {
  padding: 4px 8px;
  font-size: 16px;
  line-height: 1;
  font-family: monospace;
  border-radius: 4px;
  cursor: pointer;
  touch-action: manipulation;
  background: none;
}
.ms-btn-edit { border: 1px solid #4caf50; color: #4caf50; }
.ms-btn-del  { border: 1px solid #f44336; color: #f44336; }
.ms-empty {
  color: #555;
  font-family: monospace;
  font-size: 13px;
  text-align: center;
  padding: 24px 8px;
}
.ms-version {
  color: #333;
  font-family: monospace;
  font-size: 12px;
  margin-top: 12px;
}

#edit-campaign-header {
  display: flex;
  gap: 8px;
  align-items: center;
  margin-bottom: 12px;
}
#edit-campaign-header label {
  display: flex;
  align-items: center;
  gap: 6px;
  flex: 1;
}
#edit-campaign-header input {
  flex: 1;
  padding: 6px 8px;
  background: #1a1a2a;
  color: #fff;
  border: 1px solid #444;
  border-radius: 3px;
  font-family: monospace;
  font-size: 14px;
}
</style>
</head>
<body>
<div id="hud">
  <span class="hud-gold" id="hud-gold">G:0</span>
  <span class="hud-lives" id="hud-lives">L:0</span>
  <span class="hud-wave" id="hud-wave">W:0</span>
  <span class="hud-score" id="hud-score">S:0</span>
  <span class="hud-version" id="hud-version"></span>
  <span class="hud-phase" id="hud-phase"></span>
</div>

<div id="home"></div>
<div id="screen-list"></div>
<div id="screen-settings"></div>

<canvas id="game"></canvas>

<div id="ui">
  <div id="tower-info" style="display:none;width:100%;text-align:center;font-family:monospace">
    <div id="tower-desc" style="color:#888;font-size:12px"></div>
    <div id="tower-stats" style="color:#666;font-size:11px"></div>
  </div>
  <span id="tower-buttons"></span>
  <button id="btn-place">Place</button>
  <span id="upgrade-buttons"></span>
  <button id="btn-rotate" style="display:none;background:#333;border-color:#888;color:#ccc">Rotate (R)</button>
  <button id="btn-sell" style="display:none;background:#b71c1c;border-color:#f44336;color:#fff">Sell</button>
  <button id="btn-wave">Wave (W)</button>
  <button id="btn-bestiary" style="background:#1a1a2a;border-color:#ef5350;color:#ef5350">Bestiary (B)</button>
  <button id="btn-save">Save</button>
  <button id="btn-home">Home</button>
</div>

<div id="editor-ui">
  <div class="editor-row">
    <label style="color:#999;font-size:13px;font-family:monospace;display:flex;align-items:center;gap:4px">Name <input type="text" id="editor-map-name" maxlength="24" style="width:100px;padding:4px 6px;background:#1a1a2a;color:#fff;border:1px solid #444;border-radius:3px;font-family:monospace;font-size:13px"></label>
    <label style="color:#999;font-size:13px;font-family:monospace;display:flex;align-items:center;gap:4px">W<input type="number" id="editor-map-cols" min="5" max="60" style="width:44px;padding:4px;background:#1a1a2a;color:#fff;border:1px solid #444;border-radius:3px;font-family:monospace;font-size:13px"></label>
    <label style="color:#999;font-size:13px;font-family:monospace;display:flex;align-items:center;gap:4px">H<input type="number" id="editor-map-rows" min="5" max="60" style="width:44px;padding:4px;background:#1a1a2a;color:#fff;border:1px solid #444;border-radius:3px;font-family:monospace;font-size:13px"></label>
  </div>
  <div class="editor-row">
    <span id="brush-buttons"></span>
    <button id="btn-editor-size">1x1</button>
  </div>
  <div class="editor-row">
    <span id="brush-help" style="color:#888;font-size:11px;font-family:monospace"></span>
  </div>
  <div class="editor-row">
    <button id="btn-editor-play">Play</button>
    <button id="btn-editor-save">Save</button>
    <button id="btn-editor-clear">Clear</button>
    <button id="btn-editor-delete" style="display:none;background:#4a1a1a;border-color:#f44336;color:#f44336">Delete</button>
    <button id="btn-editor-export" style="background:#0d47a1;border-color:#42a5f5;color:#fff">Export</button>
    <button id="btn-editor-import" style="background:#0d47a1;border-color:#42a5f5;color:#fff">Import</button>
    <button id="btn-editor-back">Back</button>
  </div>
</div>

<div id="edit-campaign">
  <div id="edit-campaign-header">
    <button id="btn-campaign-back">&larr; Back</button>
    <button id="btn-campaign-save" class="btn-save">Save</button>
    <label>Name <input type="text" id="edit-campaign-name" maxlength="32" /></label>
  </div>

  <div id="settings-list">
    <h2>Towers</h2>
    <div id="settings-towers"></div>
    <button id="btn-add-tower" class="cfg-add">+ Add Tower</button>

    <h2>Monsters</h2>
    <div id="settings-monsters"></div>
    <button id="btn-add-monster" class="cfg-add">+ Add Monster</button>

    <h2>Waves</h2>
    <div id="settings-wave-monsters"></div>
    <div class="cfg-item">
      <div class="cfg-row">
        <label>Double every <span class="cfg-help" data-help="Monster counts double every this many waves">?</span> <input type="number" id="cfg-scaleEvery" min="1" value="2"> waves</label>
        <label>HP + <span class="cfg-help" data-help="Monster HP increases by this percentage each wave">?</span> <input type="number" id="cfg-hpScale" min="0" value="20">% / wave</label>
      </div>
      <div class="cfg-row">
        <label>Spawn delay <span class="cfg-help" data-help="Seconds between monster spawns on wave 1">?</span> <input type="number" id="cfg-intervalStart" min="0.1" step="0.1">s</label>
        <label>Decay/wave <span class="cfg-help" data-help="Seconds subtracted from spawn delay each wave">?</span> <input type="number" id="cfg-intervalDecay" min="0" step="0.01">s</label>
        <label>Min delay <span class="cfg-help" data-help="Minimum spawn delay regardless of wave number">?</span> <input type="number" id="cfg-intervalMin" min="0.1" step="0.1">s</label>
      </div>
    </div>

    <h2>Game</h2>
    <div class="cfg-item">
      <div class="cfg-row">
        <label>Start Gold <span class="cfg-help" data-help="Gold available at the start of a new game">?</span> <input type="number" id="cfg-startGold" min="0"></label>
        <label>Start Lives <span class="cfg-help" data-help="Lives at start. Lose 1 per monster reaching the exit">?</span> <input type="number" id="cfg-startLives" min="1"></label>
        <label>Wave Bonus <span class="cfg-help" data-help="Bonus gold earned after completing each wave">?</span> <input type="number" id="cfg-waveBonusGold" min="0"></label>
        <label>Sell Refund <span class="cfg-help" data-help="Percentage of total tower cost refunded when selling">?</span> <input type="number" id="cfg-sellRefundPercent" min="0" max="100">%</label>
      </div>
    </div>

    <div class="cfg-actions">
      <button id="btn-campaign-reset" class="btn-reset">Reset to Classic</button>
    </div>
    <div class="cfg-actions">
      <button id="btn-campaign-export" style="background:#0d47a1;border-color:#42a5f5;color:#fff">Export</button>
      <button id="btn-campaign-import" style="background:#0d47a1;border-color:#42a5f5;color:#fff">Import</button>
    </div>
  </div>

  <div id="settings-detail">
    <div class="cfg-detail-header">
      <button id="btn-detail-back">Back</button>
      <span id="settings-detail-title"></span>
      <button id="btn-detail-delete" class="cfg-remove" style="margin-left:auto">Delete</button>
    </div>
    <div class="cfg-detail-body" id="settings-detail-body"></div>
  </div>
</div>

<script type="module" src="src/main.js"></script>
</body>
</html>
