<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Tower Defence</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #0a0a1a;
  display: flex;
  flex-direction: column;
  align-items: center;
  min-height: 100vh;
  min-height: 100dvh;
  touch-action: pan-y;
  font-family: monospace;
  color: #ccc;
}
canvas {
  display: block;
  width: 100vw;
}
#ui {
  position: sticky;
  bottom: 0;
  display: flex;
  gap: 6px;
  padding: 10px 8px;
  padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px));
  flex-wrap: wrap;
  justify-content: center;
  background: #0a0a1a;
  width: 100%;
  z-index: 10;
}
#ui button {
  padding: 6px 12px;
  font-size: 14px;
  font-family: monospace;
  background: #222;
  color: #ccc;
  border: 1px solid #444;
  border-radius: 4px;
  cursor: pointer;
  touch-action: manipulation;
}
#ui button:active { background: #444; }
#ui button.selected { border-color: #fff; background: #333; }
#btn-place { background: #1b5e20; border-color: #4caf50; color: #fff; }
#btn-place:active { background: #2e7d32; }
#btn-wave { background: #0d47a1; border-color: #42a5f5; color: #fff; }
#btn-wave:active { background: #1565c0; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="ui">
  <button id="btn-melee" class="selected" data-tower="0">1: Melee (10g)</button>
  <button id="btn-range" data-tower="1">2: Range (15g)</button>
  <button id="btn-dot" data-tower="2">3: DOT (20g)</button>
  <button id="btn-pierce" data-tower="3">4: Pierce (25g)</button>
  <button id="btn-barricade" data-tower="4">5: Wall (3g)</button>
  <button id="btn-place">Place</button>
  <button id="btn-wave">Wave (W)</button>
</div>
<script src="game.js"></script>
</body>
</html>
