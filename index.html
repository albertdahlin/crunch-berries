<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Tower Defence</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #0a0a1a;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 100vh;
  overflow: hidden;
  touch-action: none;
  font-family: monospace;
  color: #ccc;
}
canvas {
  image-rendering: pixelated;
  max-width: 100vw;
  max-height: calc(100vh - 60px);
  cursor: crosshair;
}
#ui {
  display: flex;
  gap: 6px;
  padding: 8px;
  flex-wrap: wrap;
  justify-content: center;
}
#ui button {
  padding: 6px 12px;
  font-size: 14px;
  font-family: monospace;
  background: #222;
  color: #ccc;
  border: 1px solid #444;
  border-radius: 4px;
  cursor: pointer;
  touch-action: manipulation;
}
#ui button:active { background: #444; }
#ui button.selected { border-color: #fff; background: #333; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="ui">
  <button id="btn-melee" class="selected" data-tower="0">1: Melee (10g)</button>
  <button id="btn-range" data-tower="1">2: Range (15g)</button>
  <button id="btn-dot" data-tower="2">3: DOT (20g)</button>
  <button id="btn-pierce" data-tower="3">4: Pierce (25g)</button>
  <button id="btn-wave">Start Wave (W)</button>
</div>
<script src="game.js"></script>
</body>
</html>
