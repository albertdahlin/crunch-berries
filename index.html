<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Tower Defence — Ashenhold</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="src/styles.css">
</head>
<body>
<div class="bg-stars" aria-hidden="true"></div>
<div class="bg-mist" aria-hidden="true"></div>

<div id="hud">
  <div class="hud-stats">
    <span class="pip pip-gold"  id="hud-gold">G:0</span>
    <span class="pip pip-ember" id="hud-lives">L:0</span>
    <span class="pip pip-moon"  id="hud-wave">W:0</span>
    <span class="pip"           id="hud-score">S:0</span>
  </div>
  <span class="hud-version" id="hud-version"></span>
  <span id="hud-phase"></span>
</div>

<div id="home"></div>
<div id="screen-list"></div>
<div id="screen-settings"></div>

<canvas id="game"></canvas>

<div id="game-over">
  <div class="panel panel-ornate go-card">
    <div class="go-eyebrow">THE PASS IS BROKEN</div>
    <div class="go-title">Defeat</div>
    <div class="divider-ornate go-divider"><span>✦</span></div>
    <div class="go-score" id="game-over-score">Score: 0</div>
    <div class="go-hint">Tap Home to retreat to the sanctum.</div>
  </div>
</div>

<div id="game-message">
  <div class="gm-box" id="game-message-text"></div>
</div>

<script type="importmap">
{ "imports": { "three": "https://esm.sh/three@0.160.0" } }
</script>

<div id="ui">
  <div id="tower-info" style="display:none">
    <div id="tower-desc"></div>
    <div id="tower-stats"></div>
  </div>
  <div class="ui-row">
    <span id="tower-buttons"></span>
    <button id="btn-place">Place</button>
    <span id="upgrade-buttons"></span>
    <button id="btn-rotate" style="display:none">Rotate (R)</button>
    <button id="btn-sell" style="display:none">Sell</button>
    <button id="btn-wave">Wave (W)</button>
    <button id="btn-bestiary">Bestiary (B)</button>
    <button id="btn-speed">1x</button>
    <button id="btn-save">Save</button>
    <button id="btn-home">Home</button>
  </div>
</div>

<div id="editor-ui">
  <div class="editor-row editor-row-inline">
    <label><span class="editor-section-label">Name</span> <input type="text" id="editor-map-name" maxlength="24" style="width:120px"></label>
    <label><span class="editor-section-label">W</span><input type="number" id="editor-map-cols" min="5" max="60" style="width:48px"></label>
    <label><span class="editor-section-label">H</span><input type="number" id="editor-map-rows" min="5" max="60" style="width:48px"></label>
  </div>
  <div class="editor-row">
    <span class="editor-section-label">Brush</span>
    <span id="brush-buttons"></span>
    <button id="btn-editor-size">1x1</button>
  </div>
  <div class="editor-row">
    <span id="brush-help"></span>
  </div>
  <div class="editor-row">
    <button id="btn-editor-play">Play</button>
    <button id="btn-editor-save">Save</button>
    <button id="btn-editor-clear">Clear</button>
    <button id="btn-editor-delete" style="display:none">Delete</button>
    <button id="btn-editor-export">Export</button>
    <button id="btn-editor-import">Import</button>
    <button id="btn-editor-back">Back</button>
  </div>
</div>

<div id="edit-campaign">
  <div id="edit-campaign-header">
    <button id="btn-campaign-back">&larr; Back</button>
    <button id="btn-campaign-save" class="btn-save">Save</button>
    <label>Name <input type="text" id="edit-campaign-name" maxlength="32" /></label>
  </div>

  <div id="settings-list">
    <h2>Towers</h2>
    <div id="settings-towers"></div>
    <button id="btn-add-tower" class="cfg-add">+ Add Tower</button>

    <h2>Monsters</h2>
    <div id="settings-monsters"></div>
    <button id="btn-add-monster" class="cfg-add">+ Add Monster</button>

    <h2>Waves</h2>
    <div id="settings-waves"></div>
    <button id="btn-add-wave" class="cfg-add">+ Add Wave</button>
    <div class="cfg-item">
      <div class="cfg-row">
        <label>Double every <span class="cfg-help" data-help="Monster counts double every this many waves past the list">?</span> <input type="number" id="cfg-scaleEvery" min="1" value="2"> waves</label>
        <label>HP + <span class="cfg-help" data-help="Monster HP increases by this percentage each wave">?</span> <input type="number" id="cfg-hpScale" min="0" value="20">% / wave</label>
      </div>
      <div class="cfg-row">
        <label>Spawn delay <span class="cfg-help" data-help="Seconds between monster spawns on wave 1">?</span> <input type="number" id="cfg-intervalStart" min="0.1" step="0.1">s</label>
        <label>Decay/wave <span class="cfg-help" data-help="Seconds subtracted from spawn delay each wave">?</span> <input type="number" id="cfg-intervalDecay" min="0" step="0.01">s</label>
        <label>Min delay <span class="cfg-help" data-help="Minimum spawn delay regardless of wave number">?</span> <input type="number" id="cfg-intervalMin" min="0.1" step="0.1">s</label>
      </div>
    </div>

    <h2>Game</h2>
    <div class="cfg-item">
      <div class="cfg-row">
        <label>Start Gold <span class="cfg-help" data-help="Gold available at the start of a new game">?</span> <input type="number" id="cfg-startGold" min="0"></label>
        <label>Start Lives <span class="cfg-help" data-help="Lives at start. Lose 1 per monster reaching the exit">?</span> <input type="number" id="cfg-startLives" min="1"></label>
        <label>Wave Bonus <span class="cfg-help" data-help="Bonus gold earned after completing each wave">?</span> <input type="number" id="cfg-waveBonusGold" min="0"></label>
        <label>Sell Refund <span class="cfg-help" data-help="Percentage of total tower cost refunded when selling">?</span> <input type="number" id="cfg-sellRefundPercent" min="0" max="100">%</label>
      </div>
    </div>

    <div class="cfg-actions">
      <button id="btn-campaign-reset" class="btn-reset">Reset to Classic</button>
    </div>
    <div class="cfg-actions">
      <button id="btn-campaign-export">Export</button>
      <button id="btn-campaign-import">Import</button>
    </div>
  </div>

  <div id="settings-detail">
    <div class="cfg-detail-header">
      <button id="btn-detail-back">&larr; Back</button>
      <span id="settings-detail-title"></span>
      <button id="btn-detail-delete" class="cfg-remove" style="margin-left:auto">Delete</button>
    </div>
    <div class="cfg-detail-body" id="settings-detail-body"></div>
  </div>
</div>

<script type="module" src="src/main.js"></script>
</body>
</html>
